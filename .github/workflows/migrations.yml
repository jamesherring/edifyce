name: Migrations — validate

# PR-side schema checks for the Neon database (see app/db/README.md). The
# post-merge apply lives in a separate workflow (apply-migrations.yml) so it only
# ever materialises on push events, not as a skipped check on every PR.
#
#   PR -> the migrations run, and running them leaves the models applied
#
# The models (app/db/) are the source of truth; migrations/ is generated from
# them with `alembic revision --autogenerate` and is what runs against the
# database.

on:
  pull_request:
    paths:
      - "app/db/**"
      - "migrations/**"
      - "alembic.ini"
      - "scripts/check_destructive_migrations.py"
      - "pyproject.toml"
      # The job loads the models via `uv sync --locked`, so a lockfile-only
      # dependency bump (SQLAlchemy, pgvector, Alembic, …) can shift the DDL the
      # models describe and must re-run these checks.
      - "uv.lock"
      - ".github/workflows/migrations.yml"

# As in tests.yml: a superseded push's checks are not a verdict anybody acts on.
# The apply workflow has its own concurrency group and deliberately does *not*
# cancel — that one writes to a database.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Validate (PR)
    runs-on: ubuntu-latest
    # A throwaway Postgres for the migrations to actually run against. It needs
    # pgvector: the first migration issues CREATE EXTENSION vector, so a plain
    # postgres image won't do.
    services:
      dev-db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dev
    steps:
      - uses: actions/checkout@v4
        # Full history so the destructive-operation check can resolve the base
        # branch and diff every revision this PR adds against it.
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Check the revision history is linear
        # Alembic has no checksum file to corrupt; what it does have is branching,
        # and two heads from a merge means `upgrade head` is ambiguous. One head
        # is the invariant worth asserting.
        run: |
          heads=$(uv run alembic heads | grep -c . || true)
          if [ "$heads" -ne 1 ]; then
            echo "::error::Expected exactly one head, found $heads. Merge the branches with 'alembic merge'."
            uv run alembic heads
            exit 1
          fi

      - name: Run the migrations
        # Not just a smoke test — it is the only thing that proves every revision
        # executes against a real Postgres with pgvector, which planning from the
        # models does not.
        run: uv run alembic upgrade head

      - name: Check the models are in sync with migrations/
        # The drift gate. `check` compares the models against the database the
        # migrations just built and exits non-zero if anything is missing, so a
        # model change without a matching revision fails here. Read-only.
        run: uv run alembic check

      - name: Check downgrades are real
        # A revision whose downgrade() is wrong is discovered during an incident,
        # which is the worst time. Round-tripping costs seconds.
        run: |
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Check for undeclared destructive operations
        # What `atlas migrate lint` used to do. Fails on a drop_table/drop_column
        # in an upgrade() unless the revision's docstring acknowledges it.
        run: uv run python scripts/check_destructive_migrations.py --base "origin/${{ github.base_ref }}"
