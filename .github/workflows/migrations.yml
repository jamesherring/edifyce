name: Migrations — validate

# PR-side schema-as-code checks for the Neon database (see app/db/README.md).
# The post-merge apply lives in a separate workflow (apply-migrations.yml) so it
# only ever materialises on push events, not as a skipped check on every PR.
#
#   PR -> validate + lint + prove the models are in sync with migrations/
#
# The models (app/db/) are the source of truth; migrations/ is generated from
# them with `atlas migrate diff` and is what actually runs against the database.

on:
  pull_request:
    paths:
      - "app/db/**"
      - "migrations/**"
      - "atlas.hcl"
      - "tools/atlas/**"
      - "pyproject.toml"
      # The check job loads the models via `uv sync --locked`, so a lockfile-only
      # dependency bump (SQLAlchemy, pgvector, atlas-provider-sqlalchemy, …) can
      # shift the generated DDL and must re-run the drift/lint checks.
      - "uv.lock"
      - ".github/workflows/migrations.yml"

# As in tests.yml: a superseded push's checks are not a verdict anybody acts on.
# The apply workflow has its own concurrency group and deliberately does *not*
# cancel — that one writes to a database.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Validate & lint (PR)
    runs-on: ubuntu-latest
    # A throwaway Postgres with pgvector for Atlas to plan/replay against. The
    # schema issues CREATE EXTENSION vector, so a plain postgres image won't do.
    services:
      dev-db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Overrides atlas.hcl's default docker:// dev-db with the service above.
      ATLAS_DEV_URL: postgres://postgres:postgres@localhost:5432/dev?sslmode=disable
    steps:
      - uses: actions/checkout@v4
        # Full history so `migrate lint --git-base` can resolve the base branch
        # and diff every migration this PR adds/edits against it.
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Set up Atlas
        uses: ariga/setup-atlas@v0
        with:
          # pgvector extension management (the `vector` type + CREATE EXTENSION)
          # is a logged-in Atlas feature; the token authenticates the CLI.
          cloud-token: ${{ secrets.ATLAS_TOKEN }}

      - name: Validate migration directory (atlas.sum integrity)
        run: atlas migrate validate --env local

      - name: Check models are in sync with migrations/
        # If the models drift from the recorded migrations, `migrate diff` writes
        # a new file. In CI that must be a no-op — a dirty migrations/ means
        # someone changed the models without generating the migration.
        run: |
          atlas migrate diff drift_check --env local
          # `migrate diff` writes a new file only when the models and migrations
          # disagree; a clean run leaves migrations/ untouched.
          if [ -n "$(git status --porcelain -- migrations/)" ]; then
            echo "::error::Models in app/db/ drifted from migrations/. Run 'atlas migrate diff <name> --env local' locally and commit the result. Generated delta:"
            cat migrations/*drift_check*.sql 2>/dev/null || true
            git --no-pager diff -- migrations/
            exit 1
          fi

      - name: Lint migrations added by this PR for unsafe changes
        # `--latest 1` only inspects one file, so destructive SQL in an earlier
        # migration added by the same PR would merge (and later apply) unchecked.
        # `--git-base` lints every migration that differs from the target branch.
        run: atlas migrate lint --env local --git-base "origin/${{ github.base_ref }}"
