name: Migrations — apply

# Post-merge apply of the Alembic migrations to the Neon database (see
# app/db/README.md). Split out from the PR validate workflow (migrations.yml) so
# it only runs on push events, rather than surfacing as a permanently-skipped
# check on every PR.
#
#   push develop -> apply migrations to the Neon `develop` branch (Vercel Preview)
#   push main    -> apply migrations to the Neon `main` branch (Vercel Production)
#
# This runs after the merge decision is made; the PR-side checks in
# migrations.yml are what actually gate merges.

on:
  push:
    branches: [main, develop]
    paths:
      - "migrations/**"
      - "alembic.ini"
      - ".github/workflows/apply-migrations.yml"

jobs:
  apply:
    name: Apply to Neon
    runs-on: ubuntu-latest
    # Never let two applies race on the same branch's database.
    concurrency:
      group: migrate-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Unlike a bare migration tool, Alembic's env.py imports app/db/, so the
      # apply needs the project's dependencies rather than just a binary.
      - name: Install dependencies
        run: uv sync --locked

      # MIGRATE_URL is the Neon *unpooled* endpoint: a migration runs its DDL in
      # a transaction, which PgBouncer's transaction pooling breaks. env.py
      # normalises the rest (driver, and the leftover `search_path` parameter the
      # previous tool needed). See app/db/README.md.
      - name: Apply to Production (Neon main)
        if: github.ref_name == 'main'
        env:
          MIGRATE_URL: ${{ secrets.NEON_MAIN_MIGRATE_URL }}
        run: uv run alembic upgrade head

      - name: Apply to Preview (Neon develop)
        if: github.ref_name == 'develop'
        env:
          MIGRATE_URL: ${{ secrets.NEON_DEVELOP_MIGRATE_URL }}
        run: uv run alembic upgrade head
