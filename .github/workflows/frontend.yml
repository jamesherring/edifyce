name: Frontend

# Split out of tests.yml so it only runs when the SPA changed. Nothing outside
# `frontend/` is listed, because nothing outside it is what these steps read:
# `svelte-check`, `vitest` and `vite build` see the frontend tree and its
# lockfile and no Python at all. The API contract the client is written against
# lives in `frontend/src/lib/api.ts`, which is inside that tree — a backend
# change that breaks the contract is caught by the pair being edited together
# (AGENTS.md), not by type-checking the client against a running server.

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  push:
    branches: [develop]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/develop' }}

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build
