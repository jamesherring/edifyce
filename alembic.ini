# Alembic configuration — schema migrations for the Edifyce database.
#
# The SQLAlchemy models in `app/db/` are the source of truth; Alembic compares
# them against a database and writes the SQL that closes the gap.
#
# Usage (all of these need a database URL — see `migrations/env.py`, which reads
# DATABASE_URL, or pass one with `-x url=...`):
#
#   alembic upgrade head                     # apply outstanding migrations
#   alembic revision --autogenerate -m msg   # plan a migration from the models
#   alembic check                            # read-only: are the models applied?
#
# There is deliberately no `sqlalchemy.url` here. It would be the one place a
# production database URL could be committed by accident, and every caller
# already has one in the environment.

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = %(here)s
path_separator = os

# Timestamped filenames, so a directory listing reads in the order migrations
# apply rather than in hash order.
file_template = %%(year)d%%(month).2d%%(day).2d%%(hour).2d%%(minute).2d%%(second).2d_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
