{% extends 'base.html' %}

{% load static %}


{% block main_content %}
    <p id="proof_id" class="hidden">{{ proof.id }}</p>

    <h2 style="margin: 1rem 0;">Delete {{ proof.name }}</h2>

    <p>Are you sure you want to delete this proof?</p>
    <br/>

    <div class="centered">
        <a href="{% url 'website:proof' proof.id proof.slug %}"><div class="button">Back</div></a>
        <a href="{% url 'website:proof_delete_submit' proof.id proof.slug %}"><div class="button delete-button">Delete</div></a>
    </div>

{% endblock %}
