{% extends 'base.html' %}

{% load static %}


{% block main_content %}

    {{ proof.proof.data|json_script:"proof_data" }}

    <h3 style="margin-top: 0;">
        <a href="{% url 'website:formal_system' system.id system.slug %}">{{ system.name }}</a> /
        <span class="indicator" data-indicator="{{ proof.proof.indicator }}"></span>{{ proof.name }}
    </h3>

    <div id="output" class="proof-display" style="margin: 0 -2rem;"></div>

    <div class="centered">
        {% if request.user.is_authenticated and request.user.profile == proof.owner %}
            <a href="{% url 'website:proof_edit' proof.id proof.slug %}">
                <div class="button">Edit</div>
            </a>
        {% endif %}
    </div>
{% endblock %}

{% block js %}
    <script src="{% static 'website/proof_display.js' %}"></script>
    <script src="{% static 'website/proof.js' %}"></script>

{% endblock %}
