{% extends 'base.html' %}

{% load static %}


{% block main_content %}
    <p id="proof_id" class="hidden">{{ proof.id }}</p>
    <p id="system_id" class="hidden">{{ system.id }}</p>

    <h3>
        <a href="{% url 'website:formal_system' system.id system.slug %}">{{ system.name }}</a> /
        <a href="{% url 'website:proof' proof.id proof.slug %}">{{ proof.name }}</a>
    </h3>

    <div class="top-right">
        <a id="save">
            <div class="button">Save</div>
        </a>
    </div>

    <div id="ace-container" class="mathjax_ignore">{{ proof.code }}</div><div id="output" class="proof-display"></div>

    {{ proof.proof.data|json_script:"proof_data" }}

{% endblock %}


{% block js %}
    <script src="{% static 'website/ace/editors.js' %}"></script>
    <script src="{% static 'website/ace/src/ace.js' %}"></script>
    <script src="{% static 'website/proof_display.js' %}"></script>
    <script src="{% static 'website/proof_edit.js' %}"></script>
{% endblock %}

{% block css %}
    <link rel="stylesheet" href="{% static '/website/code_editor.css' %}">
    <link rel="stylesheet" href="{% static '/website/proof_edit.css' %}">
{% endblock %}
