[project]
name = "edifyce"
version = "2.0.0"
description = "FastAPI backend for compiling formal systems and verifying proofs."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "regex>=2024.9",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "fastapi-users[oauth,sqlalchemy]>=15.0.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    # A *synchronous* Postgres driver. Three callers, all off the request path:
    # the API suites run against a real database instead of SQLite
    # (tests/database.py), the batch scripts drive synchronous work directly
    # rather than through the event loop (`app.db.session.get_sync_engine`, which
    # `scripts/import_metamath.py` and `scripts/restore_proofs.py` reach for), and
    # Alembic runs its migrations on a plain Connection.
    # Not a runtime dependency: a deployment serves requests, which are async all
    # the way down, and never runs a script or a migration.
    "psycopg[binary]>=3.2",
    # The suite is a long tail of ~2,100 short tests, so wall-clock is a matter
    # of how many cores it uses. CI runs it with `-n auto --dist loadfile`.
    "pytest-xdist>=3.8.0",
    # Schema migrations (see `alembic.ini` and `migrations/`). A dev/CI tool: the
    # apply workflow installs this group, but a running deployment never migrates.
    "alembic>=1.19.1",
]

[tool.uv]
package = false
