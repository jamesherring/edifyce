[project]
name = "edifyce"
version = "2.0.0"
description = "FastAPI backend for compiling formal systems and verifying proofs."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "regex>=2024.9",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "pgvector>=0.3",
    "fastapi-users[oauth,sqlalchemy]>=15.0.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "atlas-provider-sqlalchemy>=0.2",
    "aiosqlite>=0.20",
]

[tool.uv]
package = false
